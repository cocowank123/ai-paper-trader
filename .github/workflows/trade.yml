name: AI Paper Trader

# GitHub's free cron scheduler is unreliable at high frequency, so instead of
# asking it to fire every 15 min, we start ONE long-running job every 6 hours
# that loops internally — running a cycle every 15 min for ~5.5 hours. This
# gives a reliable cadence and ~88 cycles/day.
on:
  schedule:
    - cron: "0 */6 * * *"   # start a fresh ~5.5h block every 6 hours
  workflow_dispatch: {}       # also lets you start one manually any time

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Don't let a new block start while the previous one is still looping.
concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # stay safely under GitHub's 6-hour job limit
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trade in a loop (one cycle every 15 min for ~5.5 hours)
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"

          CYCLES=22
          for i in $(seq 1 $CYCLES); do
            echo ""
            echo "######## CYCLE $i / $CYCLES ########"
            python main.py --once || echo "(cycle errored — continuing)"

            # Commit + push the account state ONLY if it actually changed.
            git add account_state.json
            if git diff --cached --quiet; then
              echo "(no state change this cycle)"
            else
              git commit -m "update paper account state [skip ci]"
              for attempt in 1 2 3; do
                if git pull --rebase origin main && git push; then break; fi
                echo "push race, retry $attempt..."; sleep 3
              done
            fi

            # Wait 15 minutes before the next cycle (skip the wait on the last one).
            if [ "$i" -lt "$CYCLES" ]; then sleep 900; fi
          done
