name: AI Paper Trader

# Runs one trading cycle on a schedule in GitHub's cloud (works with your PC off).
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min. NOTE: GitHub may delay or skip runs
                              # under load — treat it as "roughly every 15-30 min".
  workflow_dispatch: {}       # also lets you run it manually from the Actions tab

# Run the building-block actions on the current Node version (silences the
# "Node.js 20 deprecated" warning and keeps working past GitHub's cutoff).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow the workflow to commit the updated account state back to the repo.
permissions:
  contents: write

# Never let two cycles run at the same time (they'd clobber the saved state).
concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one trading cycle
        env:
          # Your key is stored as an encrypted GitHub Secret, never in the code.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub's servers can't reach Binance, so use Kraken for data here.
          EXCHANGE: kraken
        run: python main.py --once

      - name: Save updated account state back to the repo
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add account_state.json
          # Only commit + push if the state actually changed this cycle.
          if git diff --cached --quiet; then
            echo "No state change this cycle — nothing to push."
            exit 0
          fi
          git commit -m "update paper account state [skip ci]"
          # Rebase + retry so overlapping runs don't reject each other.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push race, retrying ($attempt)..."
            sleep 3
          done
          echo "Could not push state after retries." >&2
          exit 1
